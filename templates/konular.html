{% extends "base.html" %}
{% block title %}Konu Anlatımı{% endblock %}
{% block content %}
<h1>Konu Anlatımı</h1>
<div class="cards">
  {% for cat in categories %}
  <a class="card" href="{{ base }}/konular/{{ cat.slug }}/">
    <h2>{{ cat.title }}</h2>
    <p>{{ cat.description }}</p>
    <small>{{ cat.topics|length }} konu</small>
  </a>
  {% endfor %}
</div>
{% endblock %}
